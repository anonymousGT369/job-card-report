<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
  <title>Gangarampur Service - Daily Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
</head>
<body class="min-h-full bg-[var(--bg)] text-[var(--ink)] antialiased">
  <div class="mx-auto flex min-h-screen min-h-[100dvh] max-w-[1080px] flex-col px-[14px] py-[14px] md:px-[22px] md:py-[22px]">
    <header class="mb-3 flex flex-wrap items-center justify-between gap-2.5" style="animation: fadeDown .5s var(--ease) both;">
      <div>
        <h1 class="m-0 text-[19px] font-semibold">Gangarampur Service</h1>
        <span class="text-[13px] text-[var(--mut)]">Daily service sheet</span>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <input type="date" id="dt" aria-label="Sheet date" class="h-[38px] w-auto rounded-[6px] border border-[var(--line)] bg-[var(--bg)] px-2.5 text-[var(--ink)] outline-none transition duration-200 hover:border-[color:var(--acc)] focus:border-[var(--acc)] focus:ring-2 focus:ring-[color:var(--acc)]/20">
        <span id="st" class="chip">Connecting...</span>
        <button class="lk text-[var(--acc)] transition-colors duration-200 hover:bg-[color:var(--acc)]/10" id="so" hidden>Sign out</button>
      </div>
    </header>

    <form id="lg" class="mx-auto w-full max-w-[380px] rounded-[10px] border border-[var(--line)] bg-[var(--card)] p-[14px] text-center shadow-[var(--shadow-sm)]" hidden>
      <div class="login-badge" aria-hidden="true">GS</div>
      <h2 class="text-center text-[18px] font-semibold">Sign in</h2>
      <p class="mb-4 text-center text-[13px] text-[var(--mut)]">Enter your credentials to open the daily sheet</p>

      <label class="block text-left text-[12px] font-medium text-[var(--mut)]">
        Email
        <input type="email" id="em" required autocomplete="username" class="mt-1.5 w-full rounded-[6px] border border-[var(--line)] bg-[var(--bg)] px-2.5 py-2.5 text-[var(--ink)] transition duration-200 hover:border-[color:var(--acc)] focus:border-[var(--acc)] focus:outline-none focus:ring-2 focus:ring-[color:var(--acc)]/20">
      </label>

      <label class="mt-2 block text-left text-[12px] font-medium text-[var(--mut)]">
        Password
        <input type="password" id="pw" required autocomplete="current-password" class="mt-1.5 w-full rounded-[6px] border border-[var(--line)] bg-[var(--bg)] px-2.5 py-2.5 text-[var(--ink)] transition duration-200 hover:border-[color:var(--acc)] focus:border-[var(--acc)] focus:outline-none focus:ring-2 focus:ring-[color:var(--acc)]/20">
      </label>

      <p id="le" class="mt-2 min-h-[16px] text-[13px] text-[var(--warn)]"></p>
      <button class="pri mt-3 w-full rounded-[6px] border border-[var(--acc)] bg-[var(--acc)] px-4 py-[11px] font-semibold text-[var(--acc-ink)] transition duration-200 hover:shadow-[0_6px_16px_-6px_rgba(11,79,168,.6)] active:scale-[.96]">Sign in</button>
    </form>

    <div id="app" hidden>
      <nav class="mb-3 flex gap-1.5">
        <button data-tab="jobs" class="on rounded-[8px] border border-[var(--line)] bg-[var(--card)] px-4 py-2 text-[var(--ink)] transition duration-200 hover:border-[var(--acc)] hover:text-[var(--acc)] active:scale-[.96]">Jobcards</button>
        <button data-tab="rep" class="rounded-[8px] border border-[var(--line)] bg-[var(--card)] px-4 py-2 text-[var(--ink)] transition duration-200 hover:border-[var(--acc)] hover:text-[var(--acc)] active:scale-[.96]">Reports</button>
      </nav>

      <section id="tab-jobs">
        <form id="f" class="mb-3 rounded-[10px] border border-[var(--line)] bg-[var(--card)] p-[14px] shadow-[var(--shadow-sm)]" style="animation: fadeUp .45s var(--ease) both;">
          <h2 id="ft" class="mb-2.5 text-[15px] font-semibold">New jobcard</h2>
          <div class="grid mobile-grid gap-2.5" id="fg" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));"></div>
          <div class="mt-3 flex flex-wrap items-center gap-2">
            <b class="text-[15px]">Total with GST: ₹<span id="tt">0</span></b>
            <span class="flex-1"></span>
            <button type="button" class="ghost hidden rounded-[6px] border border-[var(--acc)] bg-transparent px-4 py-2.5 text-[var(--acc)] transition duration-200 active:scale-[.96]" id="cx">Cancel</button>
            <button class="pri rounded-[6px] border border-[var(--acc)] bg-[var(--acc)] px-4 py-2.5 font-medium text-[var(--acc-ink)] transition duration-200 hover:shadow-[0_6px_16px_-6px_rgba(11,79,168,.6)] active:scale-[.96]" id="sv">Add jobcard</button>
          </div>
        </form>

        <div class="ov overflow-x-auto rounded-[10px] border border-[var(--line)] bg-[var(--card)] p-[14px] shadow-[var(--shadow-sm)]" id="lst"></div>
      </section>

      <section id="tab-rep" hidden>
        <div id="rep"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
