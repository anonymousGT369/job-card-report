<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<title>Gangarampur Service - Daily Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f5;--card:#fff;--ink:#17202b;--mut:#5b6675;--line:#d5dbe3;--acc:#0b4fa8;--acc-ink:#fff;--warn:#b42318;--ok:#0f7b45;--ease:cubic-bezier(.4,0,.2,1);--dur:180ms;--shadow:0 1px 2px rgba(20,30,50,.04),0 10px 28px -16px rgba(20,30,50,.18);--shadow-sm:0 1px 2px rgba(20,30,50,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--ink:#e8edf3;--mut:#9aa6b4;--line:#2b3644;--acc:#5b9bff;--acc-ink:#0b1420;--warn:#ff8a7a;--ok:#5fd394;--shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.55);--shadow-sm:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--ink:#e8edf3;--mut:#9aa6b4;--line:#2b3644;--acc:#5b9bff;--acc-ink:#0b1420;--warn:#ff8a7a;--ok:#5fd394;--shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.55);--shadow-sm:0 1px 3px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1{font-size:19px;margin:0;font-weight:600}h2{font-size:15px;margin:0 0 10px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:14px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;animation:fadeDown .5s var(--ease) both}
.mut{color:var(--mut);font-size:13px}.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl input{width:auto;margin:0}
.chip{font-size:12px;padding:3px 9px 3px 20px;border:1px solid var(--line);border-radius:99px;color:var(--ok);background:var(--card);position:relative;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chip:before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor;animation:dotPulse 1.8s ease-in-out infinite}
.chip.bad{color:var(--warn)}
.ban{background:var(--card);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:10px}
nav{display:flex;gap:6px;margin-bottom:12px}
button{font:inherit;-webkit-tap-highlight-color:transparent}
nav button{padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),transform 120ms var(--ease)}
nav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
nav button:active{transform:scale(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);animation:fadeUp .45s var(--ease) both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:block}
input,select{width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
input:hover,select:hover{border-color:color-mix(in srgb,var(--line) 40%,var(--acc))}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.sp{flex:1}
.pri,.ghost{padding:9px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--acc);transition:background var(--dur) var(--ease),transform 120ms var(--ease),box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.pri{background:var(--acc);color:var(--acc-ink)}.ghost{background:none;color:var(--acc)}
.pri:hover{box-shadow:0 6px 16px -6px color-mix(in srgb,var(--acc) 60%,transparent)}
.pri:active,.ghost:active{transform:scale(.96)}
.ov{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}td input{width:110px;margin:0;text-align:right}
tbody tr{transition:background var(--dur) var(--ease);animation:rowIn .35s var(--ease) both}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.lk{background:none;border:0;color:var(--acc);cursor:pointer;padding:4px 7px;border-radius:5px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform 120ms var(--ease)}
.lk.d{color:var(--warn)}
.lk:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lk.d:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.lk:active{transform:scale(.94)}
.lk.d[data-arm="1"]{animation:armPulse 1s ease-in-out infinite;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);transition:background var(--dur) var(--ease)}
.r:hover{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.r input{width:110px;margin:0;text-align:right}

/* ---------- login screen ---------- */
#lg{max-width:380px;width:100%;margin:auto;text-align:center;position:relative;overflow:hidden;animation:loginIn .55s var(--ease) both}
#lg:before{content:"";position:absolute;inset:-40% -40% auto -40%;height:220px;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 22%,transparent),transparent);animation:glowDrift 7s ease-in-out infinite;pointer-events:none;z-index:0}
#lg>*{position:relative;z-index:1}
.login-badge{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#7a4dff));color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;letter-spacing:.5px;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--acc) 70%,transparent);animation:badgePop .6s var(--ease) .1s both}
#lg h2{font-size:18px;text-align:center}
.login-sub{margin:0 0 16px;text-align:center}
#lg label{text-align:left}
#lg .pri{width:100%;margin-top:14px;padding:11px 16px;font-weight:600}
#lg #le{min-height:16px;color:var(--warn)}

/* ---------- keyframes ---------- */
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes loginIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes badgePop{0%{opacity:0;transform:scale(.6) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}50%{opacity:.65;box-shadow:0 0 0 4px transparent}}
@keyframes armPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glowDrift{0%,100%{transform:translateX(-6%) translateY(0)}50%{transform:translateX(6%) translateY(4%)}}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
section.anim-in{animation:tabIn .3s var(--ease) both}

@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
 #lg:before{display:none}
}

/* ---------- responsive: phones ---------- */
@media (max-width:640px){
 .wrap{padding:10px}
 header{gap:8px}
 h1{font-size:17px}
 .ctl{width:100%;justify-content:space-between}
 nav{gap:4px}
 nav button{flex:1;padding:9px 8px;font-size:13px;text-align:center}
 .card{padding:12px;border-radius:9px}
 input,select{font-size:16px;padding:10px}
 .pri,.ghost{padding:11px 14px;font-size:14px}
 .row{margin-top:10px}
 th,td{padding:6px 7px;font-size:13px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
 .login-badge{width:46px;height:46px;font-size:16px}
}
@media (max-width:380px){
 .grid{grid-template-columns:repeat(2,1fr)}
 nav button{font-size:12px;padding:9px 4px}
 h1{font-size:16px}
}
@media (min-width:900px){
 .wrap{padding:22px}
}
@media (hover:none){
 .lk:hover,.r:hover,tbody tr:hover,.pri:hover{background:initial;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Gangarampur Service</h1><span class="mut">Daily service sheet</span></div>
 <div class="ctl"><input type="date" id="dt" aria-label="Sheet date"><span id="st" class="chip">Connecting...</span><button class="lk" id="so" hidden>Sign out</button></div>
</header>
<form id="lg" class="card" hidden>
 <div class="login-badge" aria-hidden="true">GS</div>
 <h2>Sign in</h2>
 <p class="mut login-sub">Enter your credentials to open the daily sheet</p>
 <label>Email<input type="email" id="em" required autocomplete="username"></label>
 <label style="margin-top:8px">Password<input type="password" id="pw" required autocomplete="current-password"></label>
 <p id="le" class="mut"></p>
 <button class="pri">Sign in</button>
</form>
<div id="app" hidden><nav><button data-tab="jobs" class="on">Jobcards</button><button data-tab="rep">Reports</button></nav>
<section id="tab-jobs">
 <form id="f" class="card">
  <h2 id="ft">New jobcard</h2>
  <div class="grid" id="fg"></div>
  <div class="row"><b>Total with GST: &#8377;<span id="tt">0</span></b><span class="sp"></span><button type="button" class="ghost" id="cx" hidden>Cancel</button><button class="pri" id="sv">Add jobcard</button></div>
 </form>
 <div class="card ov" id="lst"></div>
</section>
<section id="tab-rep" hidden><div id="rep"></div></section>
</div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
num=s=>(String(s).replace(/\s/g,'').match(/[+-]?\d*\.?\d+/g)||[]).reduce((a,b)=>a+ +b,0),
inr=n=>(+n||0).toLocaleString('en-IN'),
iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),
dmy=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(2,4),
tm=t=>{const p=t.split(':');return p[0]*60+ +p[1]},
mins=j=>j.tin&&j.tout?tm(j.tout)-tm(j.tin):null,
dur=m=>m==null||m<0?'-':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const OIL=[440,494,530,596,737],
FIELDS=[['name','Customer name','t'],['phone','Contact no','tel'],['frame','Vehicle frame no','t'],['reg','Register no','t'],['kms','KMS','n'],['jc','Jobcard no','t'],['type','Type of service','s',['FREE','QUICK','PAID']],['sno','Service number','n'],['tin','Vehicle in','time'],['tout','Vehicle out','time'],['same','Same-day delivery','s',['YES','NO']],['fb','Feedback','s',['EXCELLENT','VERY GOOD']],['rem','Delivery remark','t']],
AMT=[['labour','Labour'],['inj','Injector clean'],['chain','Chain clean & lube'],['fi','F.I collection'],['pol','Polish'],['parts','Parts'],['lube','Yamaha lube'],['amc','AMC']],
T=[['Service report','svc'],['Delivered','del'],['Free service','free'],['Paid service','paid'],['AMC service','amcSvc'],['AMC','amc'],['Quick repair','quick'],['Accidental in','accIn'],['Accidental out','accOut'],['Parts sale through WS','wsParts',1],['Accidental parts','accParts',1],['Parts sale through counter','counter',1],['Labour charge','labour',1],['Engine oil sold through WS','oil'],['Accidental labour','accLab',1],['FI collection','fi',1],['Injector collection','inj',1],['Polish','pol',1],['Chain lube','chain',1]],
M=[['Service report','svc'],['Free service','free'],['Paid service','paid'],['Quick repair','quick'],['A.M.C','amc'],['Accidental service','accIn'],['Workshop parts','wsParts',1],['W/S counter sell','counter',1],['Labour charge','labour',1],['FI collection','fi',1],['Injector collection','inj',1],['Polish','pol',1],['Chain lube','chain',1],['Y-lube sale WS','oil']],
MAN=['amcSvc','amc','accIn','accOut','accParts','counter','accLab'];
const SB='https://zxvnkroukqwqivlttwio.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dm5rcm91a3F3cWl2bHR0d2lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzA5NjQsImV4cCI6MjEwNTgwNjk2NH0.3aZ_Gs6OYCL9zcIbSi_vwQFpk7IRxu21hRkL_TlA2dU';
let db=false,ses=null,date=iso(new Date()),days={},open={},edit=-1,mon='',q=Promise.resolve(),ft;
async function auth(g,b){const r=await fetch(SB+'/auth/v1/token?grant_type='+g,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();
 if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');
 ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1e3)+j.expires_in};try{localStorage.setItem('gs_ses',JSON.stringify(ses))}catch(e){}}
const fresh=async f=>{if(ses&&(f||ses.expires_at*1e3-Date.now()<6e4))await auth('refresh_token',{refresh_token:ses.refresh_token})};
async function api(m,p,b,x){await fresh();const r=await fetch(SB+p,{method:m,headers:{apikey:KEY,Authorization:'Bearer '+(ses?ses.access_token:KEY),'Content-Type':'application/json',...x},body:b?JSON.stringify(b):undefined}),t=await r.text();
 if(!r.ok){const e=new Error(t);e.code=r.status;throw e}return t?JSON.parse(t):null}

const tot=j=>AMT.reduce((s,[k])=>s+(+j[k]||0),0),
day=()=>days[date]||{jobs:[],man:{}};
function rep(L,m){const sum=k=>L.reduce((s,j)=>s+(+j[k]||0),0),cnt=t=>L.filter(j=>j.type===t).length,g=k=>+m[k]||0;
 return{svc:L.length,del:L.filter(j=>j.tout).length,free:cnt('FREE'),paid:cnt('PAID'),quick:cnt('QUICK'),amcSvc:g('amcSvc'),amc:g('amc'),accIn:g('accIn'),accOut:g('accOut'),accParts:g('accParts'),counter:g('counter'),accLab:g('accLab'),wsParts:sum('parts')+sum('lube'),labour:sum('labour'),oil:L.filter(j=>OIL.includes(+j.lube)).length,fi:sum('fi'),inj:sum('inj'),pol:sum('pol'),chain:sum('chain')}}
function mtd(){const a={};Object.keys(days).filter(d=>d<=date).forEach(d=>{const x=rep(days[d].jobs||[],days[d].man||{});for(const k in x)a[k]=(a[k]||0)+x[k]});return a}

function flash(m,bad){const s=$('#st');s.textContent=m;s.className='chip'+(bad?' bad':'');clearTimeout(ft);ft=setTimeout(()=>{s.textContent=db?'Connected':'Not connected';s.className='chip'+(db?'':' bad')},2500)}
const sv=fn=>{if(!db){flash('Not saved: database not connected',1);return}
 q=q.then(fn).then(()=>flash('Saved')).catch(er=>flash(er&&(er.code===401||er.code===403)?'Not allowed: sign in again':'Save failed ('+((er&&er.code)||'error')+')',1))};
const put=p=>{const d=day(),nd={month:date.slice(0,7),date,jobs:d.jobs||[],man:d.man||{},...p};days={...days,[date]:nd};draw();sv(()=>api('POST','/rest/v1/service_days?on_conflict=day',{day:date,jobs:nd.jobs,man:nd.man},{Prefer:'resolution=merge-duplicates,return=minimal'}))};

function draw(){
 const L=day().jobs||[],r=rep(L,day().man||{}),a=mtd(),f=(v,m)=>m?'\u20B9'+inr(v):inr(v),from=dmy(date.slice(0,8)+'01');
 $('#lst').innerHTML=L.length?`<table><thead><tr><th>SL</th><th>Customer</th><th>Reg no</th><th>Jobcard</th><th>Type</th><th>In - Out</th><th>Duration</th><th class="n">Total &#8377;</th><th></th></tr></thead><tbody>${L.map((j,i)=>`<tr><td>${i+1}</td><td>${esc(j.name)}</td><td>${esc(j.reg)}</td><td title="${esc(j.jc)}">${esc(String(j.jc||'').split('/').pop())}</td><td>${esc(j.type)}</td><td>${esc(j.tin)} - ${esc(j.tout)}</td><td>${dur(mins(j))}</td><td class="n">${inr(tot(j))}</td><td><button class="lk" data-e="${i}">Edit</button><button class="lk d" data-x="${i}">Delete</button></td></tr>`).join('')}</tbody><tfoot><tr><th colspan="7">Total</th><th class="n">${inr(L.reduce((s,j)=>s+tot(j),0))}</th><th></th></tr></tfoot></table>`:'<p class="mut">No jobcards for this date yet. Add the first one above.</p>';
 $('#rep').innerHTML=`<div class="row" style="margin:0 0 12px"><button class="pri" id="cp">Copy WhatsApp report</button></div><div class="two"><div class="card"><h2>Today's report - ${dmy(date)}</h2>${T.map(([l,k,m])=>`<div class="r"><span>${l}</span>${MAN.includes(k)?`<input data-man="${k}" value="${r[k]}" inputmode="decimal" aria-label="${l}">`:`<b>${f(r[k],m)}</b>`}</div>`).join('')}</div><div class="card ov"><h2>Month to date - ${from} to ${dmy(date)}</h2><table><thead><tr><th>Item</th><th class="n">Opening</th><th class="n">In app</th><th class="n">Total</th></tr></thead><tbody>${M.map(([l,k,m])=>`<tr><td>${l}</td><td class="n"><input data-open="${k}" value="${open[k]||0}" inputmode="decimal" aria-label="Opening ${l}"></td><td class="n">${f(a[k]||0,m)}</td><td class="n"><b>${f((+open[k]||0)+(a[k]||0),m)}</b></td></tr>`).join('')}</tbody></table><p class="mut">Opening = totals before the first day entered in this app. Engine oil counts Yamaha lube amounts of 440, 494, 530, 596 or 737.</p></div></div>`}

function txt(){const r=rep(day().jobs||[],day().man||{}),a=mtd(),z=m=>m?'Rs ':'';
 return `*GANGARAMPUR SERVICE*\nDate - ${dmy(date)}\n`+T.map(([l,k,m])=>`${l} - ${z(m)}${inr(r[k])}`).join('\n')+`\n\n*Service Report*\nDate - ${dmy(date.slice(0,8)+'01')} To ${dmy(date)}\n`+M.map(([l,k,m])=>`${l} - ${z(m)}${inr((+open[k]||0)+(a[k]||0))}`).join('\n')}
async function copy(t){try{await navigator.clipboard.writeText(t);flash('Report copied')}catch(e){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();try{document.execCommand('copy');flash('Report copied')}catch(_){flash('Copy failed',1)}x.remove()}}

const fld=(k,l,t,o)=>`<label>${l}${t==='s'?`<select data-k="${k}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input data-k="${k}" ${t==='n'?'inputmode="decimal" data-n="1"':t==='time'?'type="time"':t==='tel'?'type="tel"':''} ${k==='name'||k==='jc'?'required':''} autocomplete="off">`}</label>`;
const setForm=j=>{document.querySelectorAll('#f [data-k]').forEach(e=>{const v=j?j[e.dataset.k]:null;if(e.tagName==='SELECT')e.value=v||e.options[0].value;else e.value=v==null?(e.dataset.k==='rem'?'DONE':''):(v===0?'':v)});upTot()},
rf=()=>{const o={};document.querySelectorAll('#f [data-k]').forEach(e=>o[e.dataset.k]=e.dataset.n?num(e.value):e.value.trim());return o},
upTot=()=>{$('#tt').textContent=inr(AMT.reduce((s,[k])=>s+num($('#f [data-k="'+k+'"]').value),0))},
reset=()=>{edit=-1;setForm(null);$('#ft').textContent='New jobcard';$('#sv').textContent='Add jobcard';$('#cx').hidden=true},
tab=t=>['jobs','rep'].forEach(x=>{const sec=$('#tab-'+x),on=x===t;sec.hidden=!on;if(on){sec.classList.remove('anim-in');void sec.offsetWidth;sec.classList.add('anim-in')}document.querySelector('nav [data-tab="'+x+'"]').classList.toggle('on',on)});

async function watch(k){const m=date.slice(0,7),nx=iso(new Date(+m.slice(0,4),+m.slice(5),1));if(!k){mon=m;days={};open={};draw()}
 try{const[a,b]=await Promise.all([api('GET','/rest/v1/service_days?select=day,jobs,man&order=day&day=gte.'+m+'-01&day=lt.'+nx),api('GET','/rest/v1/service_opening?select=vals&month=eq.'+m)]);
  if(m!==date.slice(0,7))return;mon=m;days={};a.forEach(r=>days[r.day]={month:m,date:r.day,jobs:r.jobs||[],man:r.man||{}});open=b[0]?b[0].vals||{}:{};draw();flash('Loaded')}catch(e){flash('Load failed ('+(e.code||e.message)+')',1)}}

$('#f').addEventListener('input',upTot);
$('#f').addEventListener('submit',e=>{e.preventDefault();const j=rf(),L=[...(day().jobs||[])];if(edit>=0)L[edit]=j;else L.push(j);reset();put({jobs:L});$('#f [data-k="name"]').focus()});
$('#dt').addEventListener('change',e=>{if(!e.target.value)return;date=e.target.value;reset();if(db&&date.slice(0,7)!==mon)watch();else draw()});
$('#rep').addEventListener('change',e=>{const t=e.target,v=num(t.value);
 if(t.dataset.man)put({man:{...(day().man||{}),[t.dataset.man]:v}});
 else if(t.dataset.open){open={...open,[t.dataset.open]:v};draw();const o=open,m=mon;sv(()=>api('POST','/rest/v1/service_opening?on_conflict=month',{month:m,vals:o},{Prefer:'resolution=merge-duplicates,return=minimal'}))}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab)tab(b.dataset.tab);
 else if(b.id==='cp')copy(txt());
 else if(b.id==='cx')reset();
 else if(b.dataset.e!=null){edit=+b.dataset.e;setForm(day().jobs[edit]);$('#ft').textContent='Edit jobcard '+(edit+1);$('#sv').textContent='Update jobcard';$('#cx').hidden=false;$('#f').scrollIntoView()}
 else if(b.dataset.x!=null){if(b.dataset.arm){const i=+b.dataset.x;if(edit>=0)reset();put({jobs:day().jobs.filter((_,n)=>n!==i)})}else{b.dataset.arm='1';b.textContent='Confirm?';setTimeout(()=>{b.dataset.arm='';b.textContent='Delete'},3000)}}});

$('#fg').innerHTML=FIELDS.map(x=>fld(...x)).join('')+AMT.map(([k,l])=>fld(k,l+' (\u20B9)','n')).join('');
$('#dt').value=date;setForm(null);draw();
const show=on=>{db=on;$('#lg').hidden=on;$('#app').hidden=!on;$('#so').hidden=!on;$('#st').textContent=on?'Connected':'Signed out';$('#st').className='chip'+(on?'':' bad')};
$('#lg').addEventListener('submit',async e=>{e.preventDefault();$('#le').textContent='';try{await auth('password',{email:$('#em').value.trim(),password:$('#pw').value});$('#pw').value='';show(true);watch()}catch(x){$('#le').textContent=x.message}});
$('#so').addEventListener('click',()=>{ses=null;try{localStorage.removeItem('gs_ses')}catch(e){}show(false)});
document.addEventListener('visibilitychange',()=>{if(db&&!document.hidden)watch(1)});
(async()=>{try{ses=JSON.parse(localStorage.getItem('gs_ses'))}catch(e){}
 if(ses){try{await fresh(true);show(true);watch();return}catch(e){ses=null}}show(false)})();
})();
</script>
</body>
</html>
